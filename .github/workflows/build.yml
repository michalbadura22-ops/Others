name: Build all .NET applications

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: Discover projects
    runs-on: windows-latest

    outputs:
      projects: ${{ steps.find-projects.outputs.projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find .NET projects
        id: find-projects
        shell: pwsh
        run: |
          $projects = @(
            Get-ChildItem -Path . -Recurse -Filter *.csproj |
              Where-Object {
                $_.FullName -notmatch '\\bin\\' -and
                $_.FullName -notmatch '\\obj\\' -and
                $_.Name -notmatch '\.Tests?\.csproj$'
              } |
              ForEach-Object {
                @{
                  name = $_.BaseName
                  path = [System.IO.Path]::GetRelativePath(
                    $env:GITHUB_WORKSPACE,
                    $_.FullName
                  )
                }
              }
          )

          if ($projects.Count -eq 0) {
            throw "Nie znaleziono projektow .csproj"
          }

          $json = ConvertTo-Json `
            -InputObject $projects `
            -Compress `
            -Depth 5

          "projects=$json" >> $env:GITHUB_OUTPUT

          Write-Host "Znalezione projekty:"
          Write-Host $json

  build:
    name: Build ${{ matrix.project.name }}
    needs: discover
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish ${{ matrix.project.name }}
        shell: pwsh
        run: |
          dotnet publish "${{ matrix.project.path }}" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o "publish\${{ matrix.project.name }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Publikacja projektu nie powiodla sie"
          }

      - name: Upload ${{ matrix.project.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-win-x64
          path: publish/${{ matrix.project.name }}/
          if-no-files-found: error