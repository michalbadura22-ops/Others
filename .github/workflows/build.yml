name: Build all .NET applications

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project.name }}
    needs: discover
    runs-on: windows-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publikacja wszystkich projektów
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object {
              $_.FullName -notmatch '\\bin\\' -and
              $_.FullName -notmatch '\\obj\\'
            }

          if ($projects.Count -eq 0) {
            throw "Nie znaleziono projektów .csproj"
          }

          foreach ($project in $projects) {
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension(
              $project.Name
            )

            $outputName = $projectName

            $outputPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "publish\$outputName"

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Publikowanie: $($project.FullName)"
            Write-Host "Katalog wynikowy: $outputPath"
            Write-Host "========================================"

            dotnet publish $project.FullName `
              -c Release `
              -r win-x64 `
              --self-contained false `
              -p:PublishSingleFile=true `
              -o $outputPath

            if ($LASTEXITCODE -ne 0) {
              throw "Publikacja projektu $($project.FullName) nie powiodła się"
            }
          }

            - name: Przesłanie osobnych artefaktów
        shell: pwsh
        run: |
          $directories = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\publish" `
            -Directory

          foreach ($directory in $directories) {
            Write-Host "Przesyłanie artefaktu: $($directory.Name)"

            gh extension install actions/gh-actions-cache 2>$null

            Compress-Archive `
              -Path "$($directory.FullName)\*" `
              -DestinationPath "$env:RUNNER_TEMP\$($directory.Name).zip" `
              -Force
          }
